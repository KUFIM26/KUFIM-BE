# KUFIM 운영 구성: 서버 1대에 MySQL · Redis · 백엔드 · Caddy(프론트 + HTTPS + 프록시).
# 사용법은 deploy/README.md를 참고하세요. 값은 같은 폴더의 .env에서 읽습니다.
name: kufim

services:
  mysql:
    image: mysql:8.0
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: kufim
      MYSQL_USER: kufim
      MYSQL_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD를 .env에 설정하세요}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:?DB_ROOT_PASSWORD를 .env에 설정하세요}
      TZ: Asia/Seoul
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_0900_ai_ci
      - --default-time-zone=+09:00
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ['CMD-SHELL', 'mysqladmin ping -h 127.0.0.1 -uroot -p"$$MYSQL_ROOT_PASSWORD" --silent']
      interval: 10s
      timeout: 5s
      retries: 12

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    # 관리자 세션과 요청 제한 카운터만 둡니다. 재시작되면 관리자만 다시 로그인하면 됩니다.
    command: ['redis-server', '--requirepass', '${REDIS_PASSWORD:?REDIS_PASSWORD를 .env에 설정하세요}']

  backend:
    build: ..
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_started
    # 주의: 이 컨테이너에 TZ를 넣지 마세요(아래 DB_URL 설명 참고).
    environment:
      SPRING_PROFILES_ACTIVE: mysql
      # serverTimezone=Asia/Seoul 때문에 JDBC 드라이버가 LocalDateTime을
      # "JVM 기본 시간대 -> 접속 시간대"로 변환해 저장합니다. 이 컨테이너는 TZ가 없어
      # JVM이 UTC이므로, 저장된 값은 실제 KST보다 9시간 앞서고 읽을 때 되돌려집니다.
      # 애플리케이션은 JpaConfig의 DateTimeProvider로 이 규칙에 모든 시각을 맞춰 두었고,
      # V8 마이그레이션이 과거 데이터도 같은 기준으로 보정했습니다.
      # 여기에 TZ: Asia/Seoul을 추가하면 변환이 사라져 저장된 시각 전체가 9시간 틀어집니다.
      DB_URL: jdbc:mysql://mysql:3306/kufim?serverTimezone=Asia/Seoul&characterEncoding=UTF-8&useSSL=false&allowPublicKeyRetrieval=true
      DB_USERNAME: kufim
      DB_PASSWORD: ${DB_PASSWORD}
      REDIS_HOST: redis
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      # 부스 QR이 가리킬 프론트 주소. 비워 두면 이 서버(SITE_DOMAIN)를 씁니다.
      FRONTEND_BASE_URL: ${FRONTEND_BASE_URL:-https://${SITE_DOMAIN:?SITE_DOMAIN을 .env에 설정하세요}}
      # 같은 출처 외에 API를 직접 부를 프론트 주소(쉼표로 구분). 끝의 빈 항목은 무시됩니다.
      CORS_ALLOWED_ORIGINS: https://${SITE_DOMAIN},${CORS_EXTRA_ORIGINS:-}
      # 첫 실행에서 총괄 관리자를 만든 뒤에는 .env에서 지우고 다시 올립니다.
      KUFIM_ADMIN_LOGIN: ${KUFIM_ADMIN_LOGIN:-}
      KUFIM_ADMIN_PASSWORD: ${KUFIM_ADMIN_PASSWORD:-}
      SMS_API_KEY: ${SMS_API_KEY:-}
      SMS_API_SECRET: ${SMS_API_SECRET:-}
      SMS_SENDER: ${SMS_SENDER:-}
      SMS_DAILY_LIMIT: ${SMS_DAILY_LIMIT:-500}
      WAITING_PER_IP_PER_MINUTE: ${WAITING_PER_IP_PER_MINUTE:-300}
      # Swagger(/swagger-ui.html). 켜면 누구나 API 목록을 볼 수 있으니 공개 운영 중에는 끕니다.
      API_DOCS_ENABLED: ${API_DOCS_ENABLED:-false}
      # 습득물 사진 저장 경로. 아래 uploads 볼륨과 짝입니다.
      KUFIM_UPLOAD_DIR: /data/uploads
      JAVA_TOOL_OPTIONS: -XX:MaxRAMPercentage=60
    volumes:
      # 사진은 DB가 아니라 이 볼륨에 쌓입니다. 재배포에도 남지만
      # 인스턴스를 지우면 함께 사라지므로 백업이 필요하면 따로 압축해 두세요.
      - uploads:/data/uploads

  web:
    # 프론트(KUFIM-FE)를 API 모드로 빌드해 Caddy 이미지에 넣습니다.
    build:
      context: ${FE_DIR:-../../KUFIM-FE}
      dockerfile_inline: |
        FROM node:22-alpine AS build
        WORKDIR /app
        COPY package.json package-lock.json ./
        RUN npm ci
        COPY . .
        ENV VITE_DATA_SOURCE=api
        RUN npm run build
        FROM caddy:2-alpine
        COPY --from=build /app/dist /srv
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - '80:80'
      - '443:443'
      - '443:443/udp'
    environment:
      SITE_DOMAIN: ${SITE_DOMAIN}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config

volumes:
  mysql-data:
  uploads:
  caddy-data:
  caddy-config:
