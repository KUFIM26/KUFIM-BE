spring:
  autoconfigure:
    exclude: org.springframework.boot.session.data.redis.autoconfigure.SessionDataRedisAutoConfiguration
  datasource:
    url: jdbc:h2:mem:kufim-test;MODE=MySQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password: ""

logging:
  level:
    org.springframework.security: WARN

app:
  rate-limit:
    admin-login-per-minute: 100
  lost-item:
    # 테스트가 서로 영향을 주지 않도록 임시 폴더에 둡니다.
    upload-dir: ${java.io.tmpdir}/kufim-test-uploads
    # 테스트 중에는 사진 정리 작업이 돌지 않게 미룹니다.
    image-cleanup-initial-delay-ms: 3600000
