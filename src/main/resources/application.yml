spring:
  application:
    name: KUFIM-BE
  profiles:
    default: local
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc.time_zone: Asia/Seoul
  flyway:
    enabled: true
    clean-disabled: true
  jackson:
    time-zone: Asia/Seoul

server:
  port: ${SERVER_PORT:8080}
  servlet:
    session:
      cookie:
        name: KUFIMSESSION
        http-only: true
        same-site: lax
        secure: ${SESSION_COOKIE_SECURE:false}
      timeout: 30m
  error:
    include-message: never
    include-stacktrace: never

springdoc:
  api-docs:
    enabled: ${API_DOCS_ENABLED:true}
  swagger-ui:
    enabled: ${API_DOCS_ENABLED:true}
    csrf:
      enabled: true
    path: /swagger-ui.html
    urls-primary-name: 00-all
    tags-sorter: alpha
    operations-sorter: alpha
    persist-authorization: false

app:
  frontend:
    base-url: ${FRONTEND_BASE_URL:http://localhost:5173}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://127.0.0.1:5173}
