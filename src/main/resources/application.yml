spring:
  application:
    name: KUFIM-BE
  profiles:
    default: local
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc.time_zone: Asia/Seoul
  flyway:
    enabled: true
    clean-disabled: true
  jackson:
    time-zone: Asia/Seoul

server:
  port: ${SERVER_PORT:8080}
  servlet:
    session:
      cookie:
        name: KUFIMSESSION
        http-only: true
        same-site: lax
        secure: ${SESSION_COOKIE_SECURE:false}
      timeout: 30m
  error:
    include-message: never
    include-stacktrace: never

springdoc:
  api-docs:
    enabled: ${API_DOCS_ENABLED:true}
  swagger-ui:
    enabled: ${API_DOCS_ENABLED:true}
    csrf:
      enabled: true
    path: /swagger-ui.html
    urls-primary-name: 00-all
    tags-sorter: alpha
    operations-sorter: alpha
    persist-authorization: false

app:
  bootstrap-admin:
    login: ${KUFIM_ADMIN_LOGIN:}
    password: ${KUFIM_ADMIN_PASSWORD:}
  rate-limit:
    # 같은 공인 IP(캠퍼스 와이파이, 통신사 NAT) 뒤의 이용자는 이 한도를 함께 씁니다.
    waiting-per-ip-per-minute: ${WAITING_PER_IP_PER_MINUTE:60}
  frontend:
    base-url: ${FRONTEND_BASE_URL:http://localhost:5173}
  sms:
    # 솔라피(solapi.com) 문자 발송. 키가 비어 있으면 발송을 시도하지 않고
    # 이력에 NOT_CONFIGURED로만 남기며, 웨이팅 호출 자체는 그대로 동작합니다.
    api-key: ${SMS_API_KEY:}
    api-secret: ${SMS_API_SECRET:}
    # 솔라피에 사전 등록된 발신번호. 등록되지 않은 번호로 보내면 3040으로 거부됩니다.
    sender: ${SMS_SENDER:}
    # 비용이 실제로 나가므로 하루 발송량을 제한합니다. 0 이하면 무제한.
    daily-limit: ${SMS_DAILY_LIMIT:500}
    # 운영진이 호출 버튼을 누르고 기다리는 경로라 짧게 끊습니다.
    timeout-seconds: ${SMS_TIMEOUT_SECONDS:3}
    base-url: ${SMS_BASE_URL:https://api.solapi.com}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://127.0.0.1:5173}
