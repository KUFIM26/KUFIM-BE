spring:
  autoconfigure:
    exclude: org.springframework.boot.session.data.redis.autoconfigure.SessionDataRedisAutoConfiguration
  datasource:
    url: jdbc:h2:file:./.local/kufim;MODE=MySQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password: ""

server:
  address: 127.0.0.1

app:
  bootstrap-admin:
    login: ${KUFIM_ADMIN_LOGIN:}
    password: ${KUFIM_ADMIN_PASSWORD:}
