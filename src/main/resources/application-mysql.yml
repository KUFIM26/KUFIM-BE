spring:
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/kufim?serverTimezone=Asia/Seoul&characterEncoding=UTF-8}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver

springdoc:
  api-docs:
    enabled: ${API_DOCS_ENABLED:false}
  swagger-ui:
    enabled: ${API_DOCS_ENABLED:false}

server:
  # 리버스 프록시(Caddy 등)의 X-Forwarded-For/Proto를 신뢰합니다. 없으면 모든 이용자가
  # 프록시 IP 하나로 보여 IP별 요청 제한을 함께 쓰고, CSRF 쿠키의 Secure 판단도 틀어집니다.
  forward-headers-strategy: native
  servlet:
    session:
      cookie:
        secure: true
