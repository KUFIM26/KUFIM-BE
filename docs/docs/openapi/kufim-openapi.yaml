        content:
          application/json:
            schema: { $ref: '#/components/schemas/FacilityUpsertRequest' }
      responses:
        '200':
          description: 수정 완료
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/Facility' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    delete:
      tags: [admin-content]
      summary: 편의시설 삭제 (논리 삭제)
      security: [{ sessionAuth: [] }]
      responses:
        '204': { description: 삭제 완료 }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /admin/uploads/images:
    post:
      tags: [admin-content]
      summary: 이미지 업로드
      description: 'F-PRG-09. S3 업로드 후 공개 URL 을 반환한다.'
      security: [{ sessionAuth: [] }]
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file:
                  type: string
                  format: binary
      responses:
        '201':
          description: 업로드 완료
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          imageUrl: { type: string, format: uri }
        '403': { $ref: '#/components/responses/Forbidden' }

  # ==================================================== 관리자: QR
  /admin/booths/{boothId}/qr:
    parameters: [{ $ref: '#/components/parameters/BoothId' }]
    post:
      tags: [admin-qr]
      summary: QR 발급 · 재발급
      description: |
        F-WAI-01.
        재발급 시 기존 `boothCode` 는 즉시 무효화되고 이전 QR 은 404 B002 로 응답한다.
      security: [{ sessionAuth: [] }]
      responses:
        '201':
          description: 발급 완료
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          boothId: { type: integer, format: int64 }
                          boothCode: { type: string }
                          qrUrl: { type: string, format: uri }
                          issuedAt: { type: string, format: date-time }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    get:
      tags: [admin-qr]
      summary: QR 이미지 다운로드
      description: 'F-WAI-02'
      security: [{ sessionAuth: [] }]
      responses:
        '200':
          description: PNG 이미지
          content:
            image/png:
              schema: { type: string, format: binary }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /admin/qr/export:
    get:
      tags: [admin-qr]
      summary: 전체 부스 QR 인쇄용 일괄 다운로드
      description: 'F-WAI-02'
      security: [{ sessionAuth: [] }]
      responses:
        '200':
