      description: 'F-MAP-12. 지도 편집 화면(A-10)에서 전체 핀을 한 번에 저장한다.'
      security: [{ sessionAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [pins]
              properties:
                pins:
                  type: array
                  items: { $ref: '#/components/schemas/MapPinUpsert' }
      responses:
        '200':
          description: 저장 완료
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data:
                        type: array
                        items: { $ref: '#/components/schemas/MapPin' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /admin/pins/{pinId}:
    delete:
      tags: [admin-map]
      summary: 핀 삭제
      security: [{ sessionAuth: [] }]
      parameters:
        - name: pinId
          in: path
          required: true
          schema: { type: integer, format: int64 }
      responses:
        '204': { description: 삭제 완료 }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  # ==================================================== 관리자: 번역
  /admin/translations:
    get:
      tags: [admin-i18n]
      summary: 번역 목록
      description: 'F-I18N-07 (2단계)'
      security: [{ sessionAuth: [] }]
      parameters:
        - name: status
          in: query
          schema: { $ref: '#/components/schemas/TranslationStatus' }
      responses:
        '200':
          description: 성공
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data:
                        type: array
                        items: { $ref: '#/components/schemas/Translation' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /admin/translations/{translationId}:
    put:
      tags: [admin-i18n]
      summary: 번역문 수동 수정
      description: |
        F-I18N-07.
        수동 수정된 항목은 `manualOverride = true` 가 되어 이후 자동 재번역 대상에서 제외된다.
      security: [{ sessionAuth: [] }]
      parameters:
        - name: translationId
          in: path
          required: true
          schema: { type: integer, format: int64 }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [translatedText]
              properties:
                translatedText: { type: string }
      responses:
        '200':
          description: 수정 완료
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/Translation' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /admin/translations/retranslate:
    post:
      tags: [admin-i18n]
      summary: 선택 항목 재번역
      security: [{ sessionAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [translationIds]
              properties:
                translationIds:
                  type: array
                  items: { type: integer, format: int64 }
      responses:
        '200':
          description: 재번역 완료
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data:
                        type: array
                        items: { $ref: '#/components/schemas/Translation' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '503':
          description: 번역 서비스 연결 실패 (I001). 원문이 유지된다.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorEnvelope' }

  # ==================================================== 관리자: 대시보드/분석
  /admin/dashboard:
    get:
      tags: [admin-analytics]
      summary: 실시간 현황 요약
      description: 'F-ADM-05 · 화면 A-02'
      security: [{ sessionAuth: [] }]
      responses:
        '200':
          description: 성공
          content:
