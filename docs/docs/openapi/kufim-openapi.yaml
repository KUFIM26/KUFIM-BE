                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/Notice' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  # ==================================================== 관리자: 지도
  /admin/map/floorplan:
    put:
      tags: [admin-map]
      summary: 도면 업로드 · 교체
      description: |
        F-MAP-11.
        교체 시 `version` 이 증가한다. 기존 핀 좌표가 어긋날 수 있으므로 좌표 재검수가 필요하다.
      security: [{ sessionAuth: [] }]
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file, width, height]
              properties:
                file: { type: string, format: binary }
                width: { type: integer }
                height: { type: integer }
      responses:
        '200':
          description: 교체 완료
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/Floorplan' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /admin/map/calibration:
    put:
      tags: [admin-map]
      summary: 좌표 보정 기준점 등록
