      description: 'F-ADM-08. 대기 시간 단축 효과 정량화의 원자료.'
      security: [{ sessionAuth: [] }]
      parameters:
        - name: from
          in: query
          schema: { type: string, format: date-time }
        - name: to
          in: query
          schema: { type: string, format: date-time }
      responses:
        '200':
          description: CSV
          content:
            text/csv:
              schema: { type: string }
