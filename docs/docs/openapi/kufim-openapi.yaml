  /admin/analytics/congestion.csv:
    get:
      tags: [admin-analytics]
      summary: 혼잡도 이력 CSV
      security: [{ sessionAuth: [] }]
      parameters:
        - name: from
          in: query
          schema: { type: string, format: date-time }
        - name: to
          in: query
          schema: { type: string, format: date-time }
      responses:
        '200':
          description: CSV
          content:
            text/csv:
              schema: { type: string }
        '403': { $ref: '#/components/responses/Forbidden' }

  /admin/audit-logs:
    get:
      tags: [admin-analytics]
      summary: 조작 이력 조회
      description: 'F-ADM-07 · 화면 A-15. 페이지네이션 적용.'
      security: [{ sessionAuth: [] }]
      parameters:
        - { $ref: '#/components/parameters/Page' }
        - { $ref: '#/components/parameters/Size' }
        - name: action
          in: query
          schema: { type: string }
        - name: accountId
          in: query
          schema: { type: integer, format: int64 }
      responses:
        '200':
          description: 성공
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/AuditLogPage' }
        '403': { $ref: '#/components/responses/Forbidden' }

  # ==================================================== 관리자: 개인정보
  /admin/privacy/purge:
    post:
      tags: [admin-privacy]
      summary: 접속 로그·익명 토큰 파기
      description: |
        F-ADM-10 (NFR-S-006).
        이용자 개인정보를 수집하지 않으므로 파기 대상은 **접속 로그의 IP 주소와 익명 토큰**이다.
        확인 문구를 요구하며, 실행 결과를 감사 로그와 `privacy_purge_log` 에 기록한다.
        웨이팅 통계는 익명 토큰을 제거한 상태로 유지된다.
      security: [{ sessionAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [targetType, confirmation]
              properties:
                targetType:
                  type: string
                  enum: [ACCESS_LOG, CLIENT_TOKEN]
                  description: 파기 대상
                confirmation:
                  type: string
                  description: 확인 문구. 정확히 일치해야 실행된다.
                  const: 데이터를 파기합니다
                note: { type: string }
      responses:
        '200':
          description: 파기 완료
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          targetCount: { type: integer }
                          executedAt: { type: string, format: date-time }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }

# =====================================================================
components:

  securitySchemes:
    sessionAuth:
      type: apiKey
      in: cookie
      name: KUFIMSESSION
      description: |
        관리자 세션 쿠키. 로그인 응답의 Set-Cookie 로 발급된다.
        Redis 에 저장되어 서버 간 공유되며, 강제 로그아웃 시 즉시 무효화된다.
        속성: HttpOnly; Secure; SameSite=Lax; 만료 8시간

  parameters:
    ClientToken:
      name: X-Client-Token
      in: header
      required: true
      description: 익명 토큰 (UUID v4). 최초 접속 시 클라이언트가 생성해 저장한다 (F-COM-01).
      schema: { type: string, format: uuid }
    AcceptLanguage:
      name: Accept-Language
      in: header
      required: false
      description: 콘텐츠 번역 언어 (F-I18N-04)
      schema:
        type: string
        enum: [ko, en]
        default: ko
    BoothId:
      name: boothId
      in: path
      required: true
      schema: { type: integer, format: int64 }
    StageId:
      name: stageId
      in: path
      required: true
      schema: { type: integer, format: int64 }
    ZoneId:
      name: zoneId
      in: path
      required: true
      schema: { type: integer, format: int64 }
    NoticeId:
      name: noticeId
      in: path
      required: true
      schema: { type: integer, format: int64 }
    AccountId:
      name: accountId
      in: path
      required: true
      schema: { type: integer, format: int64 }
    WaitingId:
      name: waitingId
      in: path
      required: true
      description: 웨이팅 public_id (추측 불가 UUID). WebSocket 개인 토픽 키로도 사용된다.
      schema: { type: string, format: uuid }
    Page:
      name: page
      in: query
      schema: { type: integer, minimum: 0, default: 0 }
    Size:
      name: size
      in: query
      schema: { type: integer, minimum: 1, maximum: 100, default: 20 }

  responses:
    BadRequest:
      description: 요청 값 검증 실패 (C001)
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorEnvelope' }
    Unauthorized:
      description: 미인증 또는 토큰 만료 (A004 · A005)
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorEnvelope' }
    Forbidden:
      description: 권한 없음 (A003)
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorEnvelope' }
    NotFound:
      description: 리소스를 찾을 수 없음
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorEnvelope' }
    TooManyRequests:
      description: 요청 빈도 제한 초과 (C004). Retry-After 헤더를 함께 반환한다.
      headers:
        Retry-After:
          schema: { type: integer }
          description: 재시도까지 대기할 초
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorEnvelope' }

  schemas:

    # ---------------------------------------------------- 공통 봉투
    Envelope:
      type: object
      required: [success]
      properties:
        success: { type: boolean, const: true }
        error:
          type: 'null'
      description: 성공 응답의 공통 구조. 하위 스키마가 `data` 를 정의한다.

    ErrorEnvelope:
      type: object
      required: [success, data, error]
      properties:
        success: { type: boolean, const: false }
        data:
          type: 'null'
        error: { $ref: '#/components/schemas/ErrorObject' }

    ErrorObject:
      type: object
      required: [code, message]
      properties:
        code:
          type: string
          pattern: '^[CWBSMAI][0-9]{3}$'
          examples: ['W001', 'M002']
        message: { type: string }
        field:
          type: [string, 'null']
        violations:
          type: array
          items:
            type: object
            properties:
              field: { type: string }
              message: { type: string }

    # ---------------------------------------------------- enum
    FestivalStatus:
      type: string
      enum: [BEFORE, ONGOING, ENDED]
    EntryStatus:
      type: string
      enum: [OPEN, RESTRICTED]
      description: OPEN=입장 가능, RESTRICTED=입장 통제 중
    CongestionLevel:
      type: string
      enum: [SMOOTH, NORMAL, CROWDED, VERY_CROWDED]
      description: |
        UNKNOWN 은 서버가 반환하지 않는다.
        클라이언트가 `serverTime - updatedAt > 15분` 일 때 자체 판정한다 (F-STG-07).
    PerformanceType:
      type: string
      enum: [GUEST, STUDENT, EVENT]
    BoothCategory:
      type: string
      enum: [EXPERIENCE, FOOD, FOOD_TRUCK, PROMOTION, PERFORMANCE]
    FacilityType:
      type: string
      enum: [RESTROOM, CONTROL_ROOM, MEDICAL, SMOKING_AREA, TRASH, ENTRANCE]
    AcceptingStatus:
      type: string
      enum: [OPEN, CLOSED, DISABLED]
      description: OPEN=접수 중, CLOSED=운영자 마감, DISABLED=웨이팅 미사용 부스
    WaitingStatusEnum:
      type: string
      enum: [WAITING, CALLED, ENTERED, CANCELED, NO_SHOW]
      description: 활성 상태는 WAITING · CALLED. 나머지는 종료 상태.
    AdminRole:
      type: string
      enum: [SUPER_ADMIN, BOOTH_ADMIN]
    PinTargetType:
      type: string
      enum: [BOOTH, FACILITY]
    TranslationStatus:
      type: string
      enum: [AUTO, MANUAL, FAILED]

    # ---------------------------------------------------- 축제/프로그램
    Festival:
      type: object
      required: [festivalId, name, startAt, endAt, status, serverTime]
      properties:
        festivalId: { type: integer, format: int64 }
        name: { type: string }
        description: { type: [string, 'null'] }
        startAt: { type: string, format: date-time }
        endAt: { type: string, format: date-time }
        status: { $ref: '#/components/schemas/FestivalStatus' }
        serverTime: { type: string, format: date-time }

    Performance:
      type: object
      required: [performanceId, title, type, startAt, endAt]
      properties:
        performanceId: { type: integer, format: int64 }
        title: { type: string }
        artist: { type: [string, 'null'] }
        type: { $ref: '#/components/schemas/PerformanceType' }
        description: { type: [string, 'null'] }
        stageId: { type: [integer, 'null'], format: int64 }
        stageName: { type: [string, 'null'] }
        startAt: { type: string, format: date-time }
        endAt: { type: string, format: date-time }
        imageUrl: { type: [string, 'null'], format: uri }
        scheduleChanged: { type: boolean, default: false }

    PerformanceNow:
      type: object
      required: [serverTime]
      properties:
        serverTime: { type: string, format: date-time }
        current:
          oneOf:
            - { $ref: '#/components/schemas/Performance' }
            - type: 'null'
        next:
          oneOf:
            - { $ref: '#/components/schemas/Performance' }
            - type: 'null'

    PerformanceUpsertRequest:
      type: object
      required: [title, type, startAt, endAt]
      properties:
        title: { type: string, maxLength: 200 }
        artist: { type: string, maxLength: 200 }
        type: { $ref: '#/components/schemas/PerformanceType' }
        description: { type: string }
        stageId: { type: integer, format: int64 }
        startAt: { type: string, format: date-time }
        endAt: { type: string, format: date-time }
        imageUrl: { type: string, format: uri }
        displayOrder: { type: integer, default: 0 }

    # ---------------------------------------------------- 부스/시설
    Booth:
      type: object
      required: [boothId, name, category, waitingEnabled]
      properties:
        boothId: { type: integer, format: int64 }
        name: { type: string }
        category: { $ref: '#/components/schemas/BoothCategory' }
        operatingHours: { type: [string, 'null'] }
        thumbnailUrl: { type: [string, 'null'], format: uri }
        waitingEnabled: { type: boolean }
        waitingStatus:
          oneOf:
            - { $ref: '#/components/schemas/WaitingStatus' }
            - type: 'null'
        pin:
          oneOf:
            - { $ref: '#/components/schemas/Point' }
            - type: 'null'

    BoothDetail:
      allOf:
        - { $ref: '#/components/schemas/Booth' }
        - type: object
          properties:
            description: { type: [string, 'null'] }
            noticeText: { type: [string, 'null'] }
            images:
              type: array
              items: { type: string, format: uri }
            boothCode: { type: [string, 'null'] }
            acceptingStatus: { $ref: '#/components/schemas/AcceptingStatus' }

    BoothByCode:
      allOf:
        - { $ref: '#/components/schemas/Booth' }
        - type: object
          properties:
            myActiveWaitingId:
              type: [string, 'null']
              format: uuid
              description: 존재하면 등록 대신 기존 대기표로 이동시킨다.

    BoothUpsertRequest:
      type: object
      required: [name, category]
      properties:
        name: { type: string, maxLength: 100 }
        category: { $ref: '#/components/schemas/BoothCategory' }
        description: { type: string }
        operatingHours: { type: string, maxLength: 100 }
        noticeText: { type: string, maxLength: 500 }
        thumbnailUrl: { type: string, format: uri }
        imageUrls:
          type: array
          items: { type: string, format: uri }
        waitingEnabled: { type: boolean, default: false }
        pin: { $ref: '#/components/schemas/Point' }

    Facility:
      type: object
      required: [facilityId, type, name]
      properties:
        facilityId: { type: integer, format: int64 }
        type: { $ref: '#/components/schemas/FacilityType' }
        name: { type: string }
        description: { type: [string, 'null'] }
        pin:
          oneOf:
            - { $ref: '#/components/schemas/Point' }
            - type: 'null'

    FacilityUpsertRequest:
      type: object
      required: [type, name]
      properties:
        type: { $ref: '#/components/schemas/FacilityType' }
        name: { type: string, maxLength: 100 }
        description: { type: string, maxLength: 255 }
        pin: { $ref: '#/components/schemas/Point' }

    # ---------------------------------------------------- 무대/혼잡도
    StagesResponse:
      type: object
      required: [serverTime, stages]
      properties:
        serverTime: { type: string, format: date-time }
        stages:
          type: array
          items: { $ref: '#/components/schemas/Stage' }

    Stage:
      type: object
      required: [stageId, name, entryStatus]
      properties:
        stageId: { type: integer, format: int64 }
        name: { type: string }
        description: { type: [string, 'null'] }
        entryStatus: { $ref: '#/components/schemas/EntryStatus' }
        displayOrder: { type: integer }
        zones:
          type: array
          items: { $ref: '#/components/schemas/StageZone' }

    StageZone:
      type: object
      required: [zoneId, name]
      properties:
        zoneId: { type: integer, format: int64 }
        name: { type: string }
        level:
          oneOf:
            - { $ref: '#/components/schemas/CongestionLevel' }
            - type: 'null'
        estimatedPeople: { type: [integer, 'null'], minimum: 0 }
        updatedAt: { type: [string, 'null'], format: date-time }
        displayOrder: { type: integer }

    StageUpsertRequest:
      type: object
      required: [name]
      properties:
        name: { type: string, maxLength: 100 }
        description: { type: string, maxLength: 255 }
        displayOrder: { type: integer, default: 0 }

    ZoneUpsertRequest:
      type: object
      required: [name]
      properties:
        name: { type: string, maxLength: 100 }
        displayOrder: { type: integer, default: 0 }

    CongestionCreateRequest:
      type: object
      required: [level]
      properties:
        level: { $ref: '#/components/schemas/CongestionLevel' }
        estimatedPeople: { type: integer, minimum: 0 }

    CongestionLog:
      type: object
      required: [congestionLogId, zoneId, level, recordedAt]
      properties:
        congestionLogId: { type: integer, format: int64 }
        zoneId: { type: integer, format: int64 }
        level: { $ref: '#/components/schemas/CongestionLevel' }
        estimatedPeople: { type: [integer, 'null'] }
        recordedAt: { type: string, format: date-time }
        recordedBy: { type: [string, 'null'] }

    CongestionPoint:
      type: object
      required: [zoneId, level, recordedAt]
      properties:
        zoneId: { type: integer, format: int64 }
        level: { $ref: '#/components/schemas/CongestionLevel' }
        estimatedPeople: { type: [integer, 'null'] }
        recordedAt: { type: string, format: date-time }

    # ---------------------------------------------------- 웨이팅
    WaitingStatus:
      type: object
      required: [boothId, acceptingStatus, waitingTeamCount, estimationAvailable]
      properties:
        boothId: { type: integer, format: int64 }
        acceptingStatus: { $ref: '#/components/schemas/AcceptingStatus' }
        waitingTeamCount: { type: integer, minimum: 0 }
        estimatedWaitMinutes: { type: [integer, 'null'], minimum: 0 }
        estimationAvailable:
          type: boolean
          description: false 면 표본 부족. 화면에는 "산출 중"으로 표시한다 (F-WAI-07).
        myActiveWaitingId:
          type: [string, 'null']
          format: uuid

    WaitingCreateRequest:
      type: object
      required: [partySize]
      additionalProperties: false
      description: |
        전화번호는 선택 입력이다. 미입력 시에도 등록이 완료되며 화면 표시로만 안내한다.
        `phoneNumber` 를 보낼 때는 `privacyConsent: true` 가 반드시 함께 있어야 하며,
        없으면 400 C002 로 거부한다. 이 규칙은 서버가 검증한다.
      properties:
        partySize:
          type: integer
          minimum: 1
          maximum: 10
        phoneNumber:
          type: [string, 'null']
          pattern: '^01[016789]-?[0-9]{3,4}-?[0-9]{4}$'
          description: 선택 입력. 입력 시 호출 문자를 받는다.
        privacyConsent:
          type: boolean
          description: '`phoneNumber` 를 보낼 때만 필수이며 true 여야 한다.'

    WaitingTicket:
      type: object
      required: [waitingId, boothId, waitingNumber, partySize, status, aheadTeamCount, registeredAt, wsTopic]
      properties:
        waitingId: { type: string, format: uuid }
        boothId: { type: integer, format: int64 }
        boothName: { type: string }
        waitingNumber:
          type: integer
          description: 부스별 대기표 번호(표시용). 순번이 아니다.
        partySize: { type: integer }
        status: { $ref: '#/components/schemas/WaitingStatusEnum' }
        aheadTeamCount: { type: integer, minimum: 0 }
        estimatedWaitMinutes: { type: [integer, 'null'] }
        registeredAt: { type: string, format: date-time }
        smsEnabled:
          type: boolean
          description: 전화번호를 입력해 호출 문자를 받는지 여부
        wsTopic:
          type: string
          description: 구독할 STOMP 개인 토픽
          examples: ['/topic/waiting/9f3c1e7a-2b5d-4c88-9a01-6d7e8f012345']

    WaitingDetail:
      type: object
      required: [waitingId, boothId, waitingNumber, status, serverTime]
      properties:
        waitingId: { type: string, format: uuid }
        boothId: { type: integer, format: int64 }
        boothName: { type: string }
        waitingNumber: { type: integer }
        partySize: { type: integer }
        status: { $ref: '#/components/schemas/WaitingStatusEnum' }
        aheadTeamCount: { type: integer, minimum: 0 }
        estimatedWaitMinutes: { type: [integer, 'null'] }
        registeredAt: { type: string, format: date-time }
        calledAt: { type: [string, 'null'], format: date-time }
        noShowDeadlineAt:
          type: [string, 'null']
          format: date-time
          description: 남은 시간 표시용. 자동 노쇼 전이는 발생하지 않는다.
        serverTime: { type: string, format: date-time }

    AdminWaitingList:
      type: object
      required: [boothId, acceptingStatus, serverTime, summary, waitings]
      properties:
        boothId: { type: integer, format: int64 }
        acceptingStatus: { $ref: '#/components/schemas/AcceptingStatus' }
        serverTime: { type: string, format: date-time }
        summary:
          type: object
          properties:
            waiting: { type: integer }
            called: { type: integer }
            enteredToday: { type: integer }
            noShowToday: { type: integer }
        waitings:
          type: array
          items: { $ref: '#/components/schemas/AdminWaitingItem' }

    AdminWaitingItem:
      type: object
      required: [waitingId, waitingNumber, partySize, status, registeredAt]
      properties:
        waitingId: { type: string, format: uuid }
        waitingNumber: { type: integer }
        partySize: { type: integer }
        status: { $ref: '#/components/schemas/WaitingStatusEnum' }
        registeredAt: { type: string, format: date-time }
        calledAt: { type: [string, 'null'], format: date-time }
        noShowDeadlineAt: { type: [string, 'null'], format: date-time }
        noShowCandidate:
          type: boolean
          description: 호출 후 5분 경과. 화면에서 강조하되 자동 전이하지 않는다.
        phoneNumberMasked:
          type: [string, 'null']
          description: 전화번호 미입력자는 null. 항상 마스킹해 반환한다.
          examples: ['010-****-5678']
        smsStatus:
          type: [string, 'null']
          enum: [SENT, FAILED, SKIPPED_LIMIT, SKIPPED_NO_PHONE, null]
          description: 호출 문자 발송 결과. 현장에서 "문자가 왜 안 갔는지" 확인용

    # ---------------------------------------------------- 지도
    Point:
      type: object
      required: [x, y]
      properties:
        x: { type: integer, minimum: 0 }
        y: { type: integer, minimum: 0 }
      description: 도면 픽셀 좌표계

    Floorplan:
      type: object
      required: [imageUrl, width, height, version]
      properties:
        imageUrl: { type: string, format: uri }
        width: { type: integer }
        height: { type: integer }
        version:
          type: integer
          description: 교체 시 증가. 클라이언트 캐시 무효화 키.

    CalibrationPoint:
      type: object
      required: [lat, lng, x, y]
      properties:
        lat: { type: number, format: double, minimum: -90, maximum: 90 }
        lng: { type: number, format: double, minimum: -180, maximum: 180 }
        x: { type: integer, minimum: 0 }
        y: { type: integer, minimum: 0 }

    MapBounds:
      type: object
      required: [minLat, maxLat, minLng, maxLng]
      properties:
        minLat: { type: number, format: double }
        maxLat: { type: number, format: double }
        minLng: { type: number, format: double }
        maxLng: { type: number, format: double }

    MapResponse:
      type: object
      required: [floorplan, calibration, bounds]
      properties:
        floorplan: { $ref: '#/components/schemas/Floorplan' }
        calibration:
          type: array
          minItems: 3
          items: { $ref: '#/components/schemas/CalibrationPoint' }
        bounds: { $ref: '#/components/schemas/MapBounds' }

    MapPin:
      type: object
      required: [pinId, targetType, targetId, name, x, y]
      properties:
        pinId: { type: integer, format: int64 }
        targetType: { $ref: '#/components/schemas/PinTargetType' }
        targetId: { type: integer, format: int64 }
        name: { type: string }
        category: { type: [string, 'null'] }
        x: { type: integer }
        y: { type: integer }
        waitingTeamCount: { type: [integer, 'null'] }

    MapPinUpsert:
      type: object
      required: [targetType, targetId, x, y]
      properties:
        targetType: { $ref: '#/components/schemas/PinTargetType' }
        targetId: { type: integer, format: int64 }
        x: { type: integer, minimum: 0 }
        y: { type: integer, minimum: 0 }

    # ---------------------------------------------------- 공지
    Notice:
      type: object
      required: [noticeId, title, content, urgent]
      properties:
        noticeId: { type: integer, format: int64 }
        title: { type: string }
        content: { type: string }
        urgent: { type: boolean }
        published: { type: boolean }
        publishedAt: { type: [string, 'null'], format: date-time }

    NoticeUpsertRequest:
      type: object
      required: [title, content]
      properties:
        title: { type: string, maxLength: 200 }
        content: { type: string }
        urgent: { type: boolean, default: false }

    # ---------------------------------------------------- 관리자
    LoginRequest:
      type: object
      required: [loginId, password]
      properties:
        loginId: { type: string, maxLength: 50 }
        password: { type: string, format: password }

    LoginResponse:
      type: object
      required: [expiresIn, account]
      description: |
        세션 쿠키는 Set-Cookie 헤더로 전달된다. 본문에는 토큰이 없다.
      properties:
        expiresIn:
          type: integer
          description: 세션 만료까지 남은 초
          examples: [28800]
        account: { $ref: '#/components/schemas/AdminAccount' }

    AdminAccount:
      type: object
      required: [accountId, name, role]
      properties:
        accountId: { type: integer, format: int64 }
        loginId: { type: string }
        name: { type: string }
        role: { $ref: '#/components/schemas/AdminRole' }
        active: { type: boolean }
        managedBoothIds:
          type: array
          items: { type: integer, format: int64 }
        lastLoginAt: { type: [string, 'null'], format: date-time }

    AccountCreateRequest:
      type: object
      required: [loginId, name, role]
      properties:
        loginId: { type: string, maxLength: 50 }
        name: { type: string, maxLength: 50 }
        role: { $ref: '#/components/schemas/AdminRole' }
        managedBoothIds:
          type: array
          items: { type: integer, format: int64 }

    AccountCreateResponse:
      allOf:
        - { $ref: '#/components/schemas/AdminAccount' }
        - type: object
          properties:
            temporaryPassword:
              type: string
              description: 발급 시 1회만 반환된다. 재조회 불가.

    SmsSendResult:
      type: object
      required: [waitingId, status, sentAt]
      properties:
        waitingId: { type: string, format: uuid }
        status:
          type: string
          enum: [SENT, FAILED, SKIPPED_LIMIT, SKIPPED_NO_PHONE]
        messageType:
          type: string
          enum: [CALL, RESEND]
        errorCode: { type: [string, 'null'] }
        sentAt: { type: string, format: date-time }

    SmsUsage:
      type: object
      required: [dailyLimit, sentToday, totalSent, totalCost]
      description: 자비 부담 예산의 소진 현황
      properties:
        dailyLimit:
          type: integer
          description: 일일 발송 한도 (TBD-07 에서 확정)
        sentToday: { type: integer }
        remainingToday: { type: integer }
        totalSent: { type: integer }
        totalFailed: { type: integer }
        totalSkippedLimit:
          type: integer
          description: 한도 초과로 발송하지 못한 건수. 이 값이 크면 한도 상향을 검토한다
        totalCost:
          type: integer
          description: 누적 발송 비용(원)
        unitCost: { type: integer, description: 건당 단가(원) }

    Translation:
      type: object
      required: [translationId, lang, sourceText, status]
      properties:
        translationId: { type: integer, format: int64 }
        lang: { type: string, examples: ['en'] }
        sourceText: { type: string }
        translatedText: { type: [string, 'null'] }
        status: { $ref: '#/components/schemas/TranslationStatus' }
        manualOverride: { type: boolean }
        updatedAt: { type: string, format: date-time }

    Dashboard:
      type: object
      required: [serverTime, activeUserCount, totalWaitingTeams]
      properties:
        serverTime: { type: string, format: date-time }
        activeUserCount: { type: integer }
        totalWaitingTeams: { type: integer }
        booths:
          type: array
          items:
            type: object
            properties:
              boothId: { type: integer, format: int64 }
              name: { type: string }
              waitingTeamCount: { type: integer }
              acceptingStatus: { $ref: '#/components/schemas/AcceptingStatus' }
              lastCalledAt: { type: [string, 'null'], format: date-time }
        zones:
          type: array
          items: { $ref: '#/components/schemas/StageZone' }
        todayStats:
          type: object
          properties:
            totalRegistered: { type: integer }
            entered: { type: integer }
            noShow: { type: integer }
            canceled: { type: integer }

    AuditLog:
      type: object
      required: [auditLogId, action, occurredAt]
      properties:
        auditLogId: { type: integer, format: int64 }
        accountId: { type: [integer, 'null'], format: int64 }
        accountName: { type: [string, 'null'] }
        action:
          type: string
          examples: ['CONGESTION_INPUT', 'WAITING_CALL', 'NOTICE_PUBLISH']
        targetType: { type: [string, 'null'] }
        targetId: { type: [string, 'null'] }
        detail: { type: [string, 'null'] }
        ip: { type: [string, 'null'] }
        occurredAt: { type: string, format: date-time }

    AuditLogPage:
      type: object
      required: [content, page, size, totalElements, totalPages]
      properties:
        content:
          type: array
          items: { $ref: '#/components/schemas/AuditLog' }
        page: { type: integer }
        size: { type: integer }
        totalElements: { type: integer }
        totalPages: { type: integer }
