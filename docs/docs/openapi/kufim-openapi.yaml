        F-MAP-07.
        최소 3점 필요하며 세 점이 일직선이면 변환 행렬이 특이행렬이 되어 거부된다.
      security: [{ sessionAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [points]
              properties:
                points:
                  type: array
                  minItems: 3
