      responses:
        '200':
          description: 등록 완료
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data:
                        type: array
                        items: { $ref: '#/components/schemas/CalibrationPoint' }
        '400':
          description: 기준점 3개 미만 (M001) 또는 일직선 (M002)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorEnvelope' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /admin/pins:
