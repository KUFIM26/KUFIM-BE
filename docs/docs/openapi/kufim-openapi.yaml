openapi: 3.1.0

info:
  title: KUFIM API
  version: 0.3.0
  summary: 건국대학교 축제 통합 정보 플랫폼 API
  description: |
    KUFIM (Konkuk University Festival Information Map) REST API.

    본 문서는 `KUFIM_API명세서.md` v0.1을 기계 판독 가능한 형태로 옮긴 것이다.
    구현 시 springdoc-openapi 가 생성하는 명세가 정식 문서가 되며,
    본 파일은 그 기준안이자 프론트엔드 타입 생성 소스로 사용한다.

    ## 인증
    - 이용자 API: 인증 없음. `X-Client-Token` (익명 UUID) 헤더로 웨이팅 소유권을 판별한다.
    - 관리자 API: `Authorization: Bearer {accessToken}`

    ## 응답 봉투
    모든 응답은 `{ success, data, error }` 구조를 따른다.

    ## 개인정보
    전화번호는 **선택 입력**이다 (TBD-01/02/03 결정, 2026-09-01).
    입력한 이용자에게만 호출 문자를 발송하고, 미입력자는 화면 표시로만 안내한다.
    `phoneNumber` 를 보낼 때는 `privacyConsent: true` 가 함께 있어야 한다.

    ## 관리자 인증
    Redis 기반 세션 쿠키(`KUFIMSESSION`)를 사용한다. 토큰 방식이 아니다.
    총괄 운영자가 계정을 강제 로그아웃시키면 즉시 차단된다.
  contact:
    name: KUFIM 팀 (김도현 · 정근녕)

servers:
  - url: https://{domain}/api/v1
    description: 운영 (도메인 TS-01 미정)
    variables:
      domain:
        default: kufim.example.ac.kr
  - url: http://localhost:8080/api/v1
    description: 로컬 개발

tags:
  - name: festival
    description: 축제 기본 정보
  - name: program
    description: 공연 · 라인업
  - name: booth
    description: 부스 · 편의시설
  - name: stage
    description: 무대 · 혼잡도
  - name: waiting
    description: 스마트 웨이팅
  - name: map
    description: 축제 지도
  - name: notice
    description: 공지
  - name: admin-auth
    description: 관리자 인증
  - name: admin-account
    description: 관리자 계정 관리
  - name: admin-stage
    description: 무대 · 구역 · 혼잡도 관리
  - name: admin-waiting
    description: 웨이팅 운영
  - name: admin-content
    description: 콘텐츠 관리
  - name: admin-qr
    description: QR 관리
  - name: admin-notice
    description: 공지 관리
  - name: admin-map
    description: 지도 관리
  - name: admin-i18n
    description: 번역 관리
  - name: admin-analytics
    description: 대시보드 · 분석
  - name: admin-privacy
    description: 개인정보

security: []

paths:

  # ==================================================== 이용자: 축제/프로그램
  /festival:
    get:
      tags: [festival]
      summary: 축제 기본 정보
      description: 'F-PRG-01 · 화면 U-01'
      parameters: [{ $ref: '#/components/parameters/ClientToken' }, { $ref: '#/components/parameters/AcceptLanguage' }]
      responses:
        '200':
          description: 성공
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/Festival' }

  /performances:
    get:
      tags: [program]
      summary: 타임테이블 · 라인업 조회
      description: 'F-PRG-02, F-PRG-03 · 화면 U-02, U-03'
      parameters:
        - { $ref: '#/components/parameters/ClientToken' }
        - { $ref: '#/components/parameters/AcceptLanguage' }
        - name: date
          in: query
          schema: { type: string, format: date }
          description: 특정 일자 필터
        - name: stageId
          in: query
          schema: { type: integer, format: int64 }
        - name: type
          in: query
          schema: { $ref: '#/components/schemas/PerformanceType' }
      responses:
        '200':
          description: 성공
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data:
                        type: array
                        items: { $ref: '#/components/schemas/Performance' }

  /performances/now:
    get:
      tags: [program]
      summary: 현재 · 다음 공연
      description: 'F-PRG-04 · 화면 U-01'
      parameters: [{ $ref: '#/components/parameters/ClientToken' }, { $ref: '#/components/parameters/AcceptLanguage' }]
      responses:
        '200':
          description: 성공. 해당 공연이 없으면 필드는 null
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/PerformanceNow' }

  /performances/{performanceId}:
    get:
      tags: [program]
      summary: 공연 상세
      description: 'F-PRG-05 · 화면 U-04'
      parameters:
        - { $ref: '#/components/parameters/ClientToken' }
        - { $ref: '#/components/parameters/AcceptLanguage' }
        - name: performanceId
          in: path
          required: true
          schema: { type: integer, format: int64 }
      responses:
        '200':
          description: 성공
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/Performance' }
        '404': { $ref: '#/components/responses/NotFound' }

  # ==================================================== 이용자: 부스/시설
  /booths:
    get:
      tags: [booth]
      summary: 부스 목록
      description: 'F-PRG-06 · 화면 U-05. 건수가 수백 건 이내이므로 페이지네이션 없이 전량 반환한다.'
      parameters:
        - { $ref: '#/components/parameters/ClientToken' }
        - { $ref: '#/components/parameters/AcceptLanguage' }
        - name: category
          in: query
          description: 복수 지정 가능
          schema:
            type: array
            items: { $ref: '#/components/schemas/BoothCategory' }
        - name: keyword
          in: query
          schema: { type: string }
        - name: waitingOnly
          in: query
          schema: { type: boolean }
      responses:
        '200':
          description: 성공
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data:
                        type: array
                        items: { $ref: '#/components/schemas/Booth' }

  /booths/{boothId}:
    get:
      tags: [booth]
      summary: 부스 상세
      description: 'F-PRG-07 · 화면 U-06'
      parameters:
        - { $ref: '#/components/parameters/ClientToken' }
        - { $ref: '#/components/parameters/AcceptLanguage' }
        - { $ref: '#/components/parameters/BoothId' }
      responses:
        '200':
          description: 성공
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/BoothDetail' }
        '404': { $ref: '#/components/responses/NotFound' }

  /booths/code/{boothCode}:
    get:
      tags: [booth, waiting]
      summary: QR 코드로 부스 식별
      description: |
        F-WAI-03 · 화면 U-07.
        QR 인코딩 URL 은 `https://{domain}/w/{boothCode}` 이며 프론트엔드가 이 API로 부스를 해석한다.
      parameters:
        - { $ref: '#/components/parameters/ClientToken' }
        - { $ref: '#/components/parameters/AcceptLanguage' }
        - name: boothCode
          in: path
          required: true
          schema: { type: string, minLength: 12, maxLength: 12 }
      responses:
        '200':
          description: 성공
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/BoothByCode' }
        '404':
          description: 유효하지 않은 QR 코드 (B002)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorEnvelope' }

  /facilities:
    get:
      tags: [booth]
      summary: 편의시설 목록
      description: 화면 U-10
      parameters:
        - { $ref: '#/components/parameters/ClientToken' }
        - { $ref: '#/components/parameters/AcceptLanguage' }
        - name: type
          in: query
          schema:
            type: array
            items: { $ref: '#/components/schemas/FacilityType' }
      responses:
        '200':
          description: 성공
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data:
                        type: array
                        items: { $ref: '#/components/schemas/Facility' }

  # ==================================================== 이용자: 무대/혼잡도
  /stages:
    get:
      tags: [stage]
      summary: 무대 및 구역별 혼잡도
      description: |
        F-STG-03 · 화면 U-01, U-11.
        서버는 원본 값을 반환하며, `serverTime - updatedAt > 15분` 인 경우 클라이언트가 UNKNOWN 으로 표시한다 (F-STG-07).
      parameters: [{ $ref: '#/components/parameters/ClientToken' }, { $ref: '#/components/parameters/AcceptLanguage' }]
      responses:
        '200':
          description: 성공
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/StagesResponse' }

  /stages/{stageId}/congestion/history:
    get:
      tags: [stage]
      summary: 혼잡도 추이
      description: 'F-STG-09 (우선순위 C) · 화면 U-11'
      parameters:
        - { $ref: '#/components/parameters/ClientToken' }
        - name: stageId
          in: path
          required: true
          schema: { type: integer, format: int64 }
        - name: from
          in: query
          schema: { type: string, format: date-time }
        - name: to
          in: query
          schema: { type: string, format: date-time }
        - name: zoneId
          in: query
          schema: { type: integer, format: int64 }
      responses:
        '200':
          description: 성공
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data:
                        type: array
                        items: { $ref: '#/components/schemas/CongestionPoint' }
        '404': { $ref: '#/components/responses/NotFound' }

  # ==================================================== 이용자: 웨이팅
  /booths/{boothId}/waiting-status:
    get:
      tags: [waiting]
      summary: 부스 대기 현황
      description: 'F-WAI-04 · 화면 U-06, U-07'
      parameters:
        - { $ref: '#/components/parameters/ClientToken' }
        - { $ref: '#/components/parameters/BoothId' }
      responses:
        '200':
          description: 성공
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/WaitingStatus' }
        '404': { $ref: '#/components/responses/NotFound' }

  /booths/{boothId}/waitings:
    post:
      tags: [waiting]
      summary: 웨이팅 등록
      description: |
        F-WAI-05, F-WAI-06 · 화면 U-07.
        중복 등록 차단은 Redis `SETNX` 로 1차 수행하고 등록 트랜잭션 내에서 재확인한다.
      parameters:
        - { $ref: '#/components/parameters/ClientToken' }
        - { $ref: '#/components/parameters/BoothId' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/WaitingCreateRequest' }
      responses:
        '201':
          description: 등록 완료
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/WaitingTicket' }
        '400':
          description: 요청 값 검증 실패 (C001) 또는 전화번호 입력 시 동의 누락 (C002)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorEnvelope' }
        '409':
          description: 중복 등록 (W001) · 접수 마감 (W002) · 웨이팅 미사용 부스 (W005)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorEnvelope' }
        '429': { $ref: '#/components/responses/TooManyRequests' }

  /waitings/me:
    get:
      tags: [waiting]
      summary: 내 대기표 목록
      description: 'F-WAI-12, F-WAI-19 · 화면 U-09. X-Client-Token 기준 활성 대기표 전체.'
      parameters: [{ $ref: '#/components/parameters/ClientToken' }]
      responses:
        '200':
          description: 성공
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data:
                        type: array
                        items: { $ref: '#/components/schemas/WaitingDetail' }
        '400':
          description: X-Client-Token 헤더 누락 (C003)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorEnvelope' }

  /waitings/{waitingId}:
    get:
      tags: [waiting]
      summary: 대기표 단건 조회
      description: 'F-WAI-12 · 화면 U-08'
      parameters:
        - { $ref: '#/components/parameters/ClientToken' }
        - { $ref: '#/components/parameters/WaitingId' }
      responses:
        '200':
          description: 성공
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/WaitingDetail' }
        '403':
          description: 본인 대기표가 아님 (W003)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorEnvelope' }
        '404':
          description: 존재하지 않는 대기표 (W004)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorEnvelope' }
    delete:
      tags: [waiting]
      summary: 웨이팅 취소
      description: 'F-WAI-11 · 화면 U-08'
      parameters:
        - { $ref: '#/components/parameters/ClientToken' }
        - { $ref: '#/components/parameters/WaitingId' }
      responses:
        '204': { description: 취소 완료 }
        '403':
          description: 본인 대기표가 아님 (W003)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorEnvelope' }
        '409':
          description: 이미 종료된 대기표 (W006)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorEnvelope' }

  # ==================================================== 이용자: 지도
  /map:
    get:
      tags: [map]
      summary: 도면 및 좌표 보정 정보
      description: |
        F-MAP-01, F-MAP-06 · 화면 U-10.
        클라이언트는 `calibration` 3점으로 어파인 변환 행렬을 계산해 GPS → 도면 좌표를 변환한다.
      parameters: [{ $ref: '#/components/parameters/ClientToken' }]
      responses:
        '200':
          description: 성공
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/MapResponse' }
        '404':
          description: 도면 미등록 (M003)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorEnvelope' }

  /map/pins:
    get:
      tags: [map]
      summary: 지도 핀 목록
      description: 'F-MAP-03, F-MAP-04 · 화면 U-10'
      parameters:
        - { $ref: '#/components/parameters/ClientToken' }
        - { $ref: '#/components/parameters/AcceptLanguage' }
        - name: targetType
          in: query
          schema: { $ref: '#/components/schemas/PinTargetType' }
        - name: category
          in: query
          description: 부스 카테고리 또는 시설 유형
          schema: { type: string }
      responses:
        '200':
          description: 성공
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data:
                        type: array
                        items: { $ref: '#/components/schemas/MapPin' }

  # ==================================================== 이용자: 공지
  /notices:
    get:
      tags: [notice]
      summary: 공지 목록
      description: 'F-COM-07 · 화면 U-12'
      parameters:
        - { $ref: '#/components/parameters/ClientToken' }
        - { $ref: '#/components/parameters/AcceptLanguage' }
        - name: urgentOnly
          in: query
          description: true 면 활성 긴급 공지만 (배너용)
          schema: { type: boolean, default: false }
      responses:
        '200':
          description: 성공
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data:
                        type: array
                        items: { $ref: '#/components/schemas/Notice' }

  /notices/{noticeId}:
    get:
      tags: [notice]
      summary: 공지 상세
      parameters:
        - { $ref: '#/components/parameters/ClientToken' }
        - { $ref: '#/components/parameters/AcceptLanguage' }
        - name: noticeId
          in: path
          required: true
          schema: { type: integer, format: int64 }
      responses:
        '200':
          description: 성공
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/Notice' }
        '404': { $ref: '#/components/responses/NotFound' }

  # ==================================================== 관리자: 인증
  /admin/auth/login:
    post:
      tags: [admin-auth]
      summary: 관리자 로그인
      description: 'F-ADM-01'
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/LoginRequest' }
      responses:
        '200':
          description: 로그인 성공
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/LoginResponse' }
        '401':
          description: 아이디 또는 비밀번호 불일치 (A001)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorEnvelope' }
        '429':
          description: 로그인 시도 초과 (A002)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorEnvelope' }

  /admin/auth/logout:
    post:
      tags: [admin-auth]
      summary: 로그아웃 (Refresh 토큰 무효화)
      description: 'F-ADM-02'
      security: [{ sessionAuth: [] }]
      responses:
        '204': { description: 로그아웃 완료 }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /admin/auth/me:
    get:
      tags: [admin-auth]
      summary: 내 계정 · 권한 · 담당 부스
      description: 'F-ADM-03'
      security: [{ sessionAuth: [] }]
      responses:
        '200':
          description: 성공
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/AdminAccount' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  # ==================================================== 관리자: 계정
  /admin/accounts:
    get:
      tags: [admin-account]
      summary: 계정 목록
      description: 'F-ADM-04 · SUPER_ADMIN'
      security: [{ sessionAuth: [] }]
      responses:
        '200':
          description: 성공
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data:
                        type: array
                        items: { $ref: '#/components/schemas/AdminAccount' }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      tags: [admin-account]
      summary: 계정 발급
      description: 'F-ADM-04 · SUPER_ADMIN. 초기 비밀번호는 응답에서 1회만 반환한다.'
      security: [{ sessionAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AccountCreateRequest' }
      responses:
        '201':
          description: 발급 완료
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
